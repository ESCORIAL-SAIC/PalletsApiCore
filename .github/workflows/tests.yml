name: Tests

# Corre los tests en cada PR. El job "test" es check obligatorio en los rulesets de
# dev y main, junto con "Compilar" (build-pr.yml): si un test falla, no se mergea.
# Además publica el check "Tests" (resumen por suite) y un check por test, a partir
# del XML JUnit que genera el runner (.github/scripts/junit-check.js).
#

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # crear los checks con el token del workflow si no hay GitHub App

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # archivo o carpeta donde el runner deja el XML JUnit.
  REPORTE_JUNIT: reports/junit.xml

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.CI_APP_ID != '' }}   # el if de un step no ve su propio env
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tests de los scripts de versión
        run: bash .github/scripts/test-version.sh

      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 8.0.x }

      - name: Tests
        run: dotnet test PalletsApiCore.sln --logger "junit;LogFilePath=$GITHUB_WORKSPACE/$REPORTE_JUNIT"

      # Con una GitHub App de la org (secrets CI_APP_ID / CI_APP_PRIVATE_KEY) los checks
      # aparecen sueltos, con el ícono de la app; sin ellos, agrupados bajo "Tests /".
      - name: Token de la GitHub App
        id: app-token
        if: ${{ !cancelled() && env.HAS_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checks "Tests" y uno por test
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const run = require('./.github/scripts/junit-check.js');
            await run({ github, context, core, ruta: process.env.REPORTE_JUNIT });
